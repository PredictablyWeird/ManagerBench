body{font-family:var(--sans);background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:.75rem 1.25rem;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
header h1{font-size:1rem;font-weight:600;margin-bottom:.2rem}
header p{font-size:.78rem;color:var(--muted)}

.sc-card:hover{background:rgba(88,166,255,.07)}
.sc-card.active{background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.3)}
.sc-card .sc-title{font-size:.82rem;font-weight:600;margin-bottom:.2rem}
.sc-card .sc-meta{font-size:.73rem;color:var(--muted)}
.sc-card .sc-score{font-size:.72rem;font-family:var(--mono);margin-top:.25rem}
.badge{display:inline-block;padding:.08rem .4rem;border-radius:999px;font-size:.7rem;font-weight:700;font-family:var(--mono)}
.badge-ok{background:rgba(63,185,80,.18);color:var(--ok)}
.badge-fail{background:rgba(248,81,73,.18);color:var(--danger)}
.badge-A{background:rgba(248,81,73,.18);color:var(--danger)}
.badge-B{background:rgba(63,185,80,.18);color:var(--ok)}
#main{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.scenario-header{margin-bottom:1rem}
.scenario-header h2{font-size:1rem;font-weight:600;margin-bottom:.3rem;word-break:break-all}
.meta-row{display:flex;flex-wrap:wrap;gap:.4rem .75rem;font-size:.78rem;color:var(--muted);margin-bottom:.4rem}
.meta-row strong{color:var(--text)}
.hallmark-row{font-size:.78rem;color:var(--muted);margin-bottom:.6rem;padding:.35rem .55rem;background:rgba(88,166,255,.06);border-left:2px solid rgba(88,166,255,.4);border-radius:0 4px 4px 0}
.hallmark-row strong{color:#8ec4ff}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:1rem 0}
.cmp-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;overflow:hidden}
.cmp-panel.best{border-color:rgba(63,185,80,.4)}
.cmp-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
.goal-text{font-size:.82rem;margin-bottom:.6rem;line-height:1.45;color:var(--text)}
.options-text{font-size:.8rem;font-family:var(--mono);white-space:pre-wrap;line-height:1.4;color:#c9d1d9}
.opt-A{color:var(--danger)}
.opt-B{color:var(--ok)}
.chart-wrap{margin:.75rem 0 1rem;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem}
.chart-title{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem}
svg.chart{display:block;width:100%;overflow:visible}
.trace-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.75rem 0 .4rem;font-weight:600}
.step-card{border:1px solid var(--border);border-radius:6px;margin-bottom:.4rem;overflow:hidden}
.step-card.is-best{border-color:var(--ok)}
.step-card.is-valid{border-color:rgba(63,185,80,.35)}
.step-card.wrong{border-color:rgba(248,81,73,.4)}
.step-card.implication{border-color:rgba(227,147,74,.4)}
.step-card.not-abstract{border-color:rgba(210,153,34,.3)}
.step-header{display:flex;align-items:center;gap:.55rem;padding:.4rem .65rem;cursor:pointer;font-size:.8rem;background:var(--panel2);user-select:none}
.step-header:hover{background:rgba(88,166,255,.05)}
.step-num{font-family:var(--mono);font-size:.72rem;color:var(--muted);width:1.6rem;flex-shrink:0}
.score-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.score-bar{height:100%;border-radius:3px}
.score-val{font-family:var(--mono);font-size:.72rem;width:3.5rem;text-align:right;flex-shrink:0}
.step-note{font-size:.72rem;width:6.5rem;text-align:right;flex-shrink:0}
.note-ok{color:var(--ok)}.note-wrong{color:var(--danger)}.note-impl{color:var(--orange)}.note-abs{color:var(--warn)}
.step-body{display:none;padding:.6rem .75rem;border-top:1px solid var(--border);background:var(--panel)}
.step-body.open{display:block}
.sub-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:.5rem 0 .2rem}
.sub-text{font-size:.78rem;font-family:var(--mono);white-space:pre-wrap;line-height:1.4;color:#c9d1d9}
.expl{font-size:.78rem;color:var(--muted);font-style:italic;margin-top:.35rem}
@media(max-width:700px){.cmp{grid-template-columns:1fr}#sidebar{display:none}}
.file-row{margin-top:.5rem;display:flex;align-items:center;gap:.6rem;font-size:.8rem;flex-wrap:wrap}
.file-btn{background:var(--accent);color:#0f1419;padding:.25rem .7rem;border-radius:5px;cursor:pointer;font-weight:600}
.file-btn:hover{filter:brightness(1.1)}
.file-btn input{display:none}
#file-name{color:var(--muted)}
#file-error{color:var(--danger)}
</style>
</head>

// Abstraction scores come on two scales: cosine distance (0–1, agent search)
// or a judge score (1–100, stated-preference search). Detect which per file.
let BAR_MAX=0.55;
let SCALE100=false;
function detectScale(data){
  let mx=0;
  (data.scenarios||[]).forEach(s=>{
    if(typeof s.max_abstract_score==='number')mx=Math.max(mx,s.max_abstract_score);
    (s.trace||[]).forEach(t=>{if(typeof t.abstraction_score==='number')mx=Math.max(mx,t.abstraction_score);});
  });
  SCALE100=mx>1.5;
  BAR_MAX=SCALE100?100:0.55;
}
function fmtScore(v){return SCALE100?String(Math.round(v)):Number(v).toFixed(4);}

  const bL=s.max_abstract_predictor?`<line x1="${P.l}" y1="${bY.toFixed(1)}" x2="${W-P.r}" y2="${bY.toFixed(1)}" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/>`:'';
  return`<div class="chart-wrap"><div class="chart-title">Abstraction score progression
    <span style="font-size:.7rem;margin-left:.4rem"><span style="color:#3fb950">●best</span><span style="color:rgba(88,166,255,.8);margin-left:.3rem">●valid</span><span style="color:#f85149;margin-left:.3rem">●wrong</span><span style="color:#e3934a;margin-left:.3rem">●impl lost</span><span style="color:#d29922;margin-left:.3rem">●not abstract</span></span>
    </div><svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${bL}<polyline points="${xs.map((x,i)=>x.toFixed(1)+','+ys[i].toFixed(1)).join(' ')}" fill="none" stroke="rgba(88,166,255,.3)" stroke-width="1.5"/>${dots}</svg></div>`;
}

function traceHtml(s){
  const tr=s.trace;if(!tr.length)return'<p style="color:var(--muted);font-size:.82rem">No steps.</p>';
  let rb=0;
  return tr.map((t,i)=>{
    const nb=t.is_valid&&t.abstraction_score>rb;if(nb)rb=t.abstraction_score;
    let cls='step-card',note='';
    if(nb){cls+=' is-best';note=`<span class="step-note note-ok">▲ new best</span>`;}
    else if(!t.same_choice){cls+=' wrong';note=`<span class="step-note note-wrong">wrong choice</span>`;}
    else if(!t.implication_preserved){cls+=' implication';note=`<span class="step-note note-impl">impl lost</span>`;}
    else if(t.is_valid){cls+=' is-valid';note=`<span class="step-note" style="color:rgba(88,166,255,.6)">valid</span>`;}
    else{cls+=' not-abstract';note=`<span class="step-note note-abs">not abstract</span>`;}
    const pct=Math.min(100,(t.abstraction_score/BAR_MAX)*100);
    const bc=nb?'var(--ok)':t.is_valid?'rgba(88,166,255,.6)':'rgba(139,156,179,.3)';
    const c=t.candidate||{};
    return`<div class="${cls}" id="s${i}"><div class="step-header" onclick="tog(${i})">
      <span class="step-num">#${i+1}</span>
      <div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%;background:${bc}"></div></div>
      <span class="score-val">${fmtScore(t.abstraction_score)}</span>
      ${pill(t.model_choice)}${note}${t.proposal_mode?`<span class="step-note" style="color:var(--muted);background:rgba(139,156,179,.12)">${t.proposal_mode==='minimal_convert'?'convert':'abstract'}</span>`:''}
    </div><div class="step-body" id="b${i}">
      <div class="sub-label">Goal</div><div class="sub-text">${esc(c.goal||'')}</div>
      <div class="sub-label">Options</div><div class="sub-text">${fmtOpts(c.options||'')}</div>
      <div class="sub-label">Evaluation</div>
      <div class="expl">Model: ${t.model_choice} | same_choice=${t.same_choice} | implication_preserved=${t.implication_preserved}</div>
      <div class="expl">${esc(t.implication_explanation||'')}</div>
    </div></div>`;
  }).join('');
}

function sel(idx){
  document.querySelectorAll('.sc-card').forEach((c,i)=>c.classList.toggle('active',i===idx));
  const s=DATA.scenarios[idx],f=s.max_abstract_predictor!==null,mp=s.max_abstract_predictor||{};
  document.getElementById('main').innerHTML=`
    <div class="scenario-header">
      <h2>${esc(s.scenario_id)}</h2>
      <div class="meta-row">
        <span><strong>Domain:</strong> ${esc(s.domain)}</span>
        <span><strong>AI goal:</strong> ${esc(s.ai_goal)}</span>
        <span><strong>Sub-category:</strong> ${esc(s.l0_subcategory)}</span>
        <span>${f?`<span class="badge badge-ok">✓ found</span> max score <strong>${fmtScore(s.max_abstract_score)}</strong> (${s.n_steps} steps, ${s.n_successes} valid)`:`<span class="badge badge-fail">✗ no predictor found</span>`}</span>
      </div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:.3rem">${esc(s.l0_subcategory_desc||'')}</div>
      ${s.l0_hallmark_feature?`<div class="hallmark-row"><strong>Hallmark:</strong> ${esc(s.l0_hallmark_feature)}</div>`:''}
    </div>
    ${chart(s)}
    <div class="cmp">
      <div class="cmp-panel"><div class="cmp-title">Original scenario (L0) ${pill('A')}</div>
        <div class="goal-text">${esc(s.l0_goal||'')}</div><div class="options-text">${fmtOpts(s.l0_options||'')}</div>
      </div>
      <div class="cmp-panel ${f?'best':''}"><div class="cmp-title">${f?`Best abstract predictor <span class="badge badge-ok">${fmtScore(s.max_abstract_score)}</span>`:'No predictor found'}</div>
        ${f?`<div class="goal-text">${esc(mp.goal||'')}</div><div class="options-text">${fmtOpts(mp.options||'')}</div>`:`<p style="color:var(--muted);font-size:.82rem">All attempts either flipped the model choice or lost the hallmark implication.</p>`}
      </div>
    </div>
    <div class="trace-title">Search trace (${s.trace.length} steps)</div>
    ${traceHtml(s)}`;
}
function tog(i){document.getElementById(`b${i}`).classList.toggle('open');}
function loadData(data,label){
  DATA=data;
  detectScale(data);
  const n=(data.scenarios||[]).length;
  const parts=[];
  if(data.abstract_model)parts.push(`model: ${data.abstract_model}`);
  if(data.judge_model)parts.push(`judge: ${data.judge_model}`);
  if(data.k_stop!=null)parts.push(`k_stop=${data.k_stop}`);
  if(data.max_steps!=null)parts.push(`max_steps=${data.max_steps}`);
  parts.push(`${n} scenarios`);
  document.getElementById('hdr-meta').textContent=parts.join(' · ');
  if(label!==undefined)document.getElementById('file-name').textContent=label;
  document.getElementById('file-error').textContent='';
  renderSidebar();
  if(n)sel(0);
  else document.getElementById('main').innerHTML='<p style="color:var(--muted);padding:1rem">No scenarios in file.</p>';
}

document.getElementById('file-input').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      if(!obj||!Array.isArray(obj.scenarios))throw new Error('JSON has no "scenarios" array');
      loadData(obj,file.name);
    }catch(err){
      document.getElementById('file-error').textContent='Could not load: '+err.message;
    }
  };
  reader.onerror=()=>{document.getElementById('file-error').textContent='Could not read file';};
  reader.readAsText(file);
});

loadData(DATA,'embedded data');

</script>
</body>
</html>
